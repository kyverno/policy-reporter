{{- if .Values.emailReports.crd.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: emailreports.policyreporter.kyverno.io
  labels:
    {{- include "policyreporter.labels" . | nindent 4 }}
spec:
  group: policyreporter.kyverno.io
  names:
    kind: EmailReport
    listKind: EmailReportList
    plural: emailreports
    shortNames:
      - er
    singular: emailreport
  scope: Namespaced
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: EmailReport configures a scheduled email report scoped to its namespace.
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: EmailReportSpec defines a scheduled email report for one namespace.
              properties:
                schedule:
                  description: Schedule is a cron expression accepted by Kubernetes CronJobs.
                  minLength: 1
                  type: string
                to:
                  description: To lists the report recipients.
                  items:
                    minLength: 1
                    type: string
                  minItems: 1
                  type: array
                type:
                  description: Type selects the existing summary or violations email report.
                  enum:
                    - summary
                    - violations
                  type: string
              required:
                - schedule
                - to
                - type
              type: object
          required:
            - spec
          type: object
      served: true
      storage: true
{{- end }}
