name: Lint helm chart

on:
  push:
    # run pipeline on push on master
    branches:
      - main
    paths:
      - "charts/**"
  
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: "0"

      - name: chart-testing (ct lint)
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - name: Run Helm Chart lint
        run: |
          set -e
          ct lint --lint-conf=.github/ct_lintconf.yaml \
                  --chart-yaml-schema=.github/ct_chart_schema.yaml \
                  --target-branch=main \
                  --validate-maintainers=false \
                  --check-version-increment=false \
                  --chart-dirs charts
